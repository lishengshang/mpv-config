name: Configuration checks

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-config:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install lightweight audio test dependency
        run: python -m pip install numpy==1.26.4
      - name: Offline regression tests (no mpv or GPU required)
        run: python tools/tests/test_check_config.py ReferenceChecks WiringChecks
      - name: Release selection, packaging and failure gates
        run: python tools/tests/test_release.py
      - name: Offline subtitle adapter regression
        run: python tools/tests/test_qwen_asr.py
      - name: Component archive and migration regression
        run: python tools/tests/test_components.py
      - name: Unified AI runtime migration regression
        run: python tools/tests/test_ai_runtime.py
      - name: Upstream sync history and failure handling
        run: python tools/tests/test_upstream_sync.py
      - name: Offline GPU dependency probe regression
        run: python tools/tests/test_gpu_probe.py
      - name: GPU verifier failure handling (native integration skipped without mpv)
        run: python tools/tests/test_verify_gpu.py
      - name: Project references and script wiring
        run: python tools/maintenance/check_config.py
