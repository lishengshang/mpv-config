# 源自 Windows dev。由右键菜单或 --profile 按需启用。

[HQ]
profile-desc=高质量缩放
profile-restore=copy-equal
scale=ewa_lanczossharp
cscale=bilinear
dscale=lanczos
scale-antiring=0.5
dscale-antiring=0.5
linear-upscaling=no
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=no

[Dither]
profile-desc=常规抖动
profile-restore=copy-equal
dither-depth=auto
dither=fruit
dither-size-fruit=6

[Dither+]
profile-desc=误差扩散抖动
profile-restore=copy-equal
dither-depth=auto
dither=error-diffusion
error-diffusion=floyd-steinberg

[DeBand-low]
profile-desc=低强度去色带
profile-restore=copy-equal
deband=yes
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=16

[DeBand-medium]
profile-desc=中强度去色带
profile-restore=copy-equal
deband=yes
deband-iterations=2
deband-threshold=64
deband-range=16
deband-grain=24

[DeBand-high]
profile-desc=高强度去色带
profile-restore=copy-equal
deband=yes
deband-iterations=3
deband-threshold=64
deband-range=16
deband-grain=24

[Target]
profile-desc=自动选择显示色彩目标
profile-restore=copy-equal
icc-profile=""
icc-profile-auto=no
target-prim=auto
target-trc=auto
target-contrast=auto

[HDR2SDR]
profile-desc=将 HDR 映射到 SDR 显示器
profile-restore=copy-equal
icc-profile=""
icc-profile-auto=no
target-prim=bt.709
target-trc=gamma2.2
target-colorspace-hint=no
tone-mapping=auto
gamut-mapping-mode=auto
hdr-contrast-recovery=0.30
hdr-compute-peak=auto
hdr-peak-percentile=99.995
hdr-peak-decay-rate=20
hdr-scene-threshold-low=1.0
hdr-scene-threshold-high=3.0
allow-delayed-peak-detect=no

[Tscale]
profile-desc=显示同步与帧混合
profile-restore=copy-equal
video-sync=display-resample
interpolation=yes
tscale=oversample

[Tscale+]
profile-desc=显示同步与平滑帧混合
profile-restore=copy-equal
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.65

