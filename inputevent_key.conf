##⇘⇘以下为基于 inputevent.lua 脚本实现的增强式功能键位绑定
## '#event:click'用于指定同键位单击时的操作，'#event:double_click'用于指定同键位双击时的操作，'#event:press'用于指定同键位长按时的操作，'#event:release'用于指定同键位长按释放时的操作
## 更多的键位动作请参考脚本上游说明：https://github.com/zhongfly/InputEvent/tree/property-expansion
##! 注意：并非所有键位都具有以上不同的触发动作
## 同时脚本支持同一种动作根据条件触发不同的命令，条件的语法等同于 profile-cond（自动 profile 的条件语句）
## 即脚本语法升级为 '#event:动作|条件'（原先的#event:动作视为无条件执行命令），命令执行的优先级是从下到上按顺序，执行第一个满足条件的命令

RIGHT           seek 5                                        #event:click #desc:前进 5 秒
RIGHT           script-message-to evafast speedup             #event:press #desc:逐渐加速快进
RIGHT           script-message-to evafast slowdown            #event:release #desc:结束快进并恢复原速度

TAB             script-message-to panel_manager open files #event:click #desc:打开 OSD 文件浏览器
TAB             script-message-to uosc toggle-ui              #event:press #desc:临时切换播放器控件显示
TAB             script-message-to uosc toggle-ui              #event:release #desc:恢复播放器控件显示状态

PGDWN           add chapter -1                                                               #event:click #desc:上一章节
PGDWN           playlist-prev;show-text 播放列表:${playlist-pos-1}/${playlist-count}         #event:click|chapter == 0 #desc:第一章时：切换上个文件
PGDWN           playlist-prev;show-text 播放列表:${playlist-pos-1}/${playlist-count}         #event:press #desc:切换上个文件
PGUP            add chapter  1                                                               #event:click #desc:下一章节
PGUP            playlist-next;show-text 播放列表:${playlist-pos-1}/${playlist-count}         #event:click|chapter+1 == chapters #desc:最后一章时：切换下个文件
PGUP            playlist-next;show-text 播放列表:${playlist-pos-1}/${playlist-count}         #event:press #desc:切换下个文件

SPACE           cycle pause;script-message-to uosc flash-pause-indicator  #event:click #desc:播放／暂停
SPACE           script-binding simplehistory/history-load-last            #event:click|idle_active #desc:空闲时：加载最后播放文件
SPACE           no-osd set speed 3; set pause no                          #event:press #desc:临时以 3 倍速播放
SPACE           ignore                                                    #event:release #desc:恢复长按前的速度与暂停状态

MBTN_LEFT       cycle pause;script-message-to uosc flash-pause-indicator  #event:click #desc:播放／暂停
MBTN_LEFT       cycle fullscreen                                          #event:double_click #desc:切换全屏
