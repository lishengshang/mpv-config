# Native bindings remain available. Optional commands go through the extension menu.
MBTN_RIGHT script-binding uosc/menu
o          script-message-to uosc open-file          #menu: 打开文件
SPACE      cycle pause                               #menu: 播放／暂停
<          playlist-prev                            #menu: 播放 > 上一个文件
>          playlist-next                            #menu: 播放 > 下一个文件
[          add speed -0.1                           #menu: 播放 > 减慢
]          add speed 0.1                            #menu: 播放 > 加快
BS         set speed 1                              #menu: 播放 > 恢复 1 倍
F5         script-binding uosc/playlist               #menu: 播放 > 播放列表…
F7         script-binding uosc/chapters               #menu: 播放 > 章节…
F10        script-binding uosc/audio                  #menu: 音轨…
F11        script-binding uosc/subtitles              #menu: 字幕 > 选择字幕…
#          script-binding uosc/load-subtitles          #menu: 字幕 > 加载外挂字幕…
Alt+f      script-message-to extensions whisper       #menu: 字幕 > AI 字幕…
f          cycle fullscreen                          #menu: 全屏
s          screenshot                                #menu: 截图
#          script-message-to extensions menu          #menu: 扩展…
q          quit                                      #menu: 退出
