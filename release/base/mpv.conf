# Public Windows Base. Keep the load list explicit.
vo=gpu-next
gpu-api=d3d11
hwdec=auto-copy-safe
osc=no
idle=yes
load-scripts=no
load-auto-profiles=no
scripts-append=~~/scripts/uosc
scripts-append=~~/scripts/thumbfast.lua
scripts-append=~~/release/base/extensions.lua
save-position-on-quit=yes
watch-later-dir=~~/state/watch_later
watch-later-options=start,speed,volume,vid,aid,sid
reset-on-next-file=speed,vid,aid,sid,secondary-sid,vf,af,sub-delay,audio-delay
screenshot-template=~~/files/screenshots/%{media-title}-%P-%n
gpu-shader-cache-dir=~~/cache/shaders_cache
include=~~/profiles.conf
include=~~/local.conf
