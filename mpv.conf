hwdec=auto
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid

# uosc and playlist names
osc=no
osd-playlist-entry=filename

# Automatically load matching tracks beside the video or in these subfolders.
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:字幕
slang=zh-Hans,zh-CN,chs,sc,zh-Hant,zh-TW,zh-HK,cht,tc,zh,zho,chi
audio-file-auto=fuzzy
audio-file-paths=audio:audios:audio 5.1:audios 5.1:audio 7.1:audios 7.1:音轨
