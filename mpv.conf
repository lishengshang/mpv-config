# 播放与窗口
hwdec=auto
osc=no
osd-playlist-entry=filename
autofit-larger=90%x90%
autofit-smaller=40%x30%
directory-mode=ignore
hr-seek=yes
msg-level=auto_profiles=warn

# 续播与逐集重置
save-position-on-quit=yes
watch-later-options=start,speed,volume,vid,aid,sid
reset-on-next-file=vid,aid,sid,secondary-sid,loop-file,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,video-aspect-override,audio-delay,sub-pos,sub-scale,sub-delay,sub-visibility,secondary-sub-visibility,secondary-sub-pos,secondary-sub-scale,secondary-sub-delay

# 界面
no-osd-bar
osd-on-seek=msg
osd-font="Noto Sans Mono CJK SC"
osd-font-size=24
osd-outline-size=1
osd-outline-color="#1C1B1F"
osd-shadow-offset=0
osd-fractions=yes
osd-duration=2000

# 音轨与字幕
audio-file-auto=fuzzy
audio-file-paths=audio:audios:audio 5.1:audios 5.1:audio 7.1:audios 7.1:音轨
alang=japanese,jpn,jap,ja,jp,english,eng,en
sub-auto=fuzzy
sub-file-paths=sub:subs:subtitles:字幕
slang=chs,sc,zh-Hans,zh-CN,cht,tc,zh-Hant,zh-HK,zh-TW,chi,zho,zh
sub-font="Noto Sans CJK SC"
sub-font-size=50
sub-bold=yes
sub-color="#FFFFFF"
sub-outline-size=0.5
sub-outline-color="#000000"
sub-shadow-offset=0.5

# 截图
screenshot-format=webp
screenshot-webp-quality=85
screenshot-webp-compression=6
screenshot-directory=~/Pictures/mpv
screenshot-template="%F-%P-%n"

[local-history]
profile-cond=p.path and not p.path:find('://', 1, true)
profile-restore=copy
save-watch-history=yes
