u                cycle sub-ass-override;show-text "字幕渲染样式:${sub-ass-override}"                                           #menu: 字幕 > 样式与兼容性 > 主字幕样式覆盖
F                cycle-values sub-font "Noto Sans CJK SC" "Noto Sans CJK KR" "Noto Serif CJK SC" "Noto Serif CJK KR";show-text "字幕字体:${sub-font}" #menu: 字幕 > 样式与兼容性 > 默认字体  #@choices=sub-font
ALT+R            cycle secondary-sub-ass-override;show-text "次字幕样式覆盖:${secondary-sub-ass-override}"                      #menu: 字幕 > 样式与兼容性 > 次字幕样式覆盖      #@state=(secondary_sub_ass_override and 'checked')
ALT+T            cycle blend-subtitles;show-text "字幕混合视频帧:${blend-subtitles}"                                            #menu: 字幕 > 样式与兼容性 > 字幕混合视频帧      #@state=(blend_subtitles and 'checked')
K                cycle sub-fix-timing                 ;show-text "字幕时序修复:${sub-fix-timing}"                              #menu: 字幕 > 样式与兼容性 > 字幕时序修复        #@state=(sub_fix_timing and 'checked')
J                cycle sub-ass-vsfilter-color-compat  ;show-text "字幕颜色转换方式:${sub-ass-vsfilter-color-compat}"             #menu: 字幕 > 样式与兼容性 > 字幕颜色转换方式
V                cycle sub-ass-use-video-data ;show-text "使用视频信息:${sub-ass-use-video-data}"                              #menu: 字幕 > 样式与兼容性 > 使用视频信息
ALT+B            cycle sub-vsfilter-bidi-compat       ;show-text "bidi 双向检测兼容性:${sub-vsfilter-bidi-compat}"              #menu: 字幕 > 样式与兼容性 > bidi 双向检测样式与兼容性 #@state=(sub_vsfilter_bidi_compat and 'checked')
ALT+X            cycle-values sub-ass-style-overrides "ScaledBorderAndShadow=no" "ScaledBorderAndShadow=yes";show-text "强制替换 ass 样式:${sub-ass-style-overrides}" #menu: 字幕 > 样式与兼容性 > ass 字幕阴影边框缩放
H                cycle sub-ass-force-margins          ;show-text "ass 字幕输出黑边:${sub-ass-force-margins}"                   #menu: 字幕 > 样式与兼容性 > ass 字幕输出到黑边  #@state=(sub_ass_force_margins and 'checked')
ALT+Z            cycle sub-use-margins                ;show-text "srt 字幕输出黑边:${sub-use-margins}"                         #menu: 字幕 > 样式与兼容性 > srt 字幕输出到黑边  #@state=(sub_use_margins and 'checked')
P                cycle stretch-image-subs-to-screen   ;show-text "pgs 字幕输出黑边:${stretch-image-subs-to-screen}"            #menu: 字幕 > 样式与兼容性 > pgs 字幕输出到黑边  #@state=(stretch_image_subs_to_screen and 'checked')
CTRL+p           cycle sub-gray;show-text "pgs 字幕灰度转换:${sub-gray}"                                                       #menu: 字幕 > 样式与兼容性 > pgs 字幕灰度转换    #@state=(sub_gray and 'checked')
SHIFT+BS         set sub-pos 100;set sub-scale 1.0;set sub-delay 0;set secondary-sub-pos 0;set secondary-sub-scale 1.0;set secondary-sub-delay 0;show-text "重置字幕状态" #menu: 字幕 > 重置位置、字号与延迟

## 截图与导出
s                screenshot subtitles                                                                                    #menu: 截图与导出 > 原始尺寸截图（含字幕）
S                screenshot video                                                                                        #menu: 截图与导出 > 原始尺寸截图（不含字幕）
CTRL+s           show-text "截屏" 400;script-message delay-command 0.5 screenshot window                                   #menu: 截图与导出 > 窗口截图（含界面）
ALT+s            script-message-to menu_ui continuous subtitles                                                         #menu: 截图与导出 > 连续截图 > 含字幕：开始／停止
ALT+S            script-message-to menu_ui continuous video                                                             #menu: 截图与导出 > 连续截图 > 不含字幕：开始／停止
CTRL+S           script-message-to mpv_cropscreen crop-screenshot                                                        #menu: 截图与导出 > 区域截图…
CTRL+ALT+s       script-message-to mpv_cropscreen take-screenshot                                                        #menu: 截图与导出 > 字幕拼图 > 选择／截取字幕区域  #! 第一次触发可选择字幕区域，后续触发将自动截取该区域画面
CTRL+ALT+S       script-message-to mpv_cropscreen stitch-images                                                          #menu: 截图与导出 > 字幕拼图 > 拼接截图
c                script-message slicing_mark                                                                             #menu: 截图与导出 > 片段导出 > 标记起点／终点并导出
a                script-message slicing_audio                                                                            #menu: 截图与导出 > 片段导出 > 包含音频
CTRL+C           script-message clear_slicing_mark                                                                       #menu: 截图与导出 > 片段导出 > 清除标记
w                script-message set_animated_start                                                                       #menu: 截图与导出 > 动图导出 > 标记起点
W                script-message set_animated_end                                                                         #menu: 截图与导出 > 动图导出 > 标记终点
CTRL+w           script-message make_animated                                                                            #menu: 截图与导出 > 动图导出 > 导出动图
CTRL+W           script-message make_animated_with_subtitles                                                             #menu: 截图与导出 > 动图导出 > 导出动图（含字幕）

## 窗口
ALT+t            cycle ontop;show-text "置顶:${ontop}"                                                                     #menu: 窗口 > 置顶      #@state=(ontop and 'checked')
ALT+b            cycle window-maximized                                                                                  #menu: 窗口 > 最大化        #@state=(window_maximized and 'checked')
ENTER            cycle fullscreen                                                                                        #menu: 窗口 > 全屏          #@state=(fullscreen and 'checked')
p                script-message-to pip toggle-pip                                                                        #menu: 窗口 > 画中画
CTRL+-           add window-scale -0.1;show-text "窗口缩小:${window-scale}"                                                  #menu: 窗口 > 窗口尺寸 > 缩小
CTRL+=           add window-scale  0.1;show-text "窗口放大:${window-scale}"                                                  #menu: 窗口 > 窗口尺寸 > 放大
CTRL+B           cycle title-bar;show-text "显示标题栏:${title-bar}"                                                          #menu: 窗口 > 显示标题栏    #@state=(title_bar and 'checked')
b                cycle window-minimized                                                                                  #menu: 窗口 > 最小化

