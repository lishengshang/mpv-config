Ctrl+1              script-message-to quality select shader KrigBilateral #menu: 画质增强 > 单项 Shader > KrigBilateral 色度重建
Ctrl+2              script-message-to quality select shader SSimSuperRes #menu: 画质增强 > 单项 Shader > SSimSuperRes 放大
Ctrl+3              script-message-to quality select shader SSimDownscaler #menu: 画质增强 > 单项 Shader > SSimDownscaler 缩小
Ctrl+4              script-message-to quality select shader adaptive-sharpen #menu: 画质增强 > 单项 Shader > 自适应锐化
Ctrl+5              script-message-to quality select shader FSRCNNX-single #menu: 画质增强 > 单项 Shader > FSRCNNX
Ctrl+6              script-message-to quality select shader FSRCNNX-distort #menu: 画质增强 > 单项 Shader > FSRCNNX-distort
