Ctrl+o              script-binding uosc/open-file                 #menu: 打开文件…
SPACE               cycle pause                                  #menu: 播放 / 暂停
MBTN_LEFT           cycle pause
MBTN_LEFT_DBL       ignore
MBTN_RIGHT          script-binding uosc/menu-blurred
ENTER               cycle fullscreen                             #menu: 全屏

F5                  script-binding uosc/playlist                   #menu: 播放列表…
<                   playlist-prev                                #menu: 上一项
>                   playlist-next                                #menu: 下一项
F7                  script-binding uosc/chapters                   #menu: 章节…
F10                 script-binding uosc/audio                      #menu: 音轨…
F11                 script-binding uosc/subtitles                  #menu: 字幕…

Ctrl+z              script-binding undoredo/undo                   #menu: 跳转 > 撤销
Ctrl+x              script-binding undoredo/redo                   #menu: 跳转 > 重做
[                   no-osd add speed -0.1; script-message-to uosc flash-speed #menu: 倍速 > 减慢 0.1 倍
]                   no-osd add speed 0.1; script-message-to uosc flash-speed  #menu: 倍速 > 加快 0.1 倍
BS                  no-osd set speed 1.0; script-message-to uosc flash-speed   #menu: 倍速 > 恢复 1 倍
WHEEL_UP            no-osd add volume 2; script-message-to uosc flash-volume
WHEEL_DOWN          no-osd add volume -2; script-message-to uosc flash-volume
