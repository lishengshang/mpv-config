ALT+_            script-message-to gpu_effects toggle MIX_SR_MEMC_TRT  # GPU 增强：MIX_SR_MEMC_TRT
'                script-message-to gpu_effects toggle NR_BM3D_CUDA  # GPU 增强：NR_BM3D_CUDA
CTRL+ALT+1       script-message-to gpu_effects toggle ArtCNN_C4F16  # GPU 增强：轻量 shader
CTRL+ALT+2       script-message-to gpu_effects toggle ArtCNN_C4F32  # GPU 增强：均衡 shader
Q                quit-watch-later                                                                                       # 退出并保存当前状态
MENU             script-message-to uosc menu-blurred                                       # 开/关 uosc 菜单
POWER            quit
PLAY             cycle pause;script-message-to uosc flash-pause-indicator
PAUSE            cycle pause;script-message-to uosc flash-pause-indicator
PLAYPAUSE        cycle pause;script-message-to uosc flash-pause-indicator
STOP             quit
FORWARD          seek  30
REWIND           seek -30
NEXT             playlist-next
PREV             playlist-prev
SPACE            cycle pause;script-message-to uosc flash-pause-indicator
MBTN_LEFT        cycle pause;script-message-to uosc flash-pause-indicator
MBTN_LEFT_DBL    ignore
MBTN_RIGHT       script-message-to uosc menu-blurred                                    # 开/关 uosc 菜单（与底部菜单按钮一致）
MBTN_MID         script-message-to context_menu open                                    # 打开 menu 菜单（OSD 版）
#MBTN_RIGHT      context-menu                                                           # 打开 menu 菜单（GUI 版，备用）
MBTN_FORWARD     playlist-next;show-text "播放列表:${playlist-pos-1}/${playlist-count}" # 前进键 切换到列表中的下个文件
MBTN_BACK        playlist-prev;show-text "播放列表:${playlist-pos-1}/${playlist-count}" # 后退键 切换到列表中的上个文件
MBTN_RIGHT_DBL   ignore
WHEEL_UP         no-osd add volume  2; script-message-to uosc flash-volume
WHEEL_DOWN       no-osd add volume -2; script-message-to uosc flash-volume
#WHEEL_LEFT      ignore
#WHEEL_RIGHT     ignore
CTRL+MBTN_LEFT   script-binding positioning/drag-to-pan              # 拖动画面
CTRL+MBTN_MID    script-binding positioning/align-to-cursor          # 对齐画面到光标处
CTRL+WHEEL_UP    script-binding positioning/cursor-centric-zoom  0.1 # 放大画面
CTRL+WHEEL_DOWN  script-binding positioning/cursor-centric-zoom -0.1 # 缩小画面
ESC              set fullscreen no;set window-maximized no
9                no-osd add volume -1; script-message-to uosc flash-volume  # 音量 -1
0                no-osd add volume  1; script-message-to uosc flash-volume  # 音量 +1
