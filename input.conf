Alt+1               script-message-to quality select shader FSRCNNX #menu: 画质增强 > Shader 组合 > FSRCNNX
Alt+2               script-message-to quality select shader FSRCNNX+ #menu: 画质增强 > Shader 组合 > FSRCNNX+
Alt+3               script-message-to quality select shader ravu-zoom #menu: 画质增强 > Shader 组合 > RAVU Zoom
Alt+4               script-message-to quality select shader AnimeJaNai #menu: 画质增强 > Shader 组合 > AnimeJaNai
Alt+5               script-message-to quality select shader Ani4K    #menu: 画质增强 > Shader 组合 > Ani4K
