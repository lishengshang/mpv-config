# 打开与文件
o                   script-binding uosc/open-file                 #menu: 打开与文件 > 浏览文件…
Ctrl+o              script-binding uosc/open-file
Ctrl+Shift+v        update-clipboard text; loadfile ${clipboard/text} #menu: 打开与文件 > 打开剪贴板链接
Alt+o               script-binding uosc/show-in-directory         #menu: 打开与文件 > 定位当前文件
`                   script-binding select/select-watch-history    #menu: 打开与文件 > 播放历史…
#                   script-message-to local_tools bookmarks        #menu: 打开与文件 > 书签 > 书签列表…
#                   script-message-to local_tools save-bookmark position #menu: 打开与文件 > 书签 > 添加进度书签
#                   script-message-to local_tools save-bookmark file #menu: 打开与文件 > 书签 > 添加文件书签
#                   script-message-to local_tools remove-bookmarks #menu: 打开与文件 > 书签 > 删除书签…

# 播放
SPACE               cycle pause; script-message-to uosc flash-pause-indicator #menu: 播放 > 播放／暂停
MBTN_LEFT           cycle pause; script-message-to uosc flash-pause-indicator
MBTN_LEFT_DBL       ignore
MBTN_RIGHT          script-binding uosc/menu-blurred
F4                  script-binding uosc/menu
F5                  script-binding uosc/playlist                  #menu: 播放 > 播放列表…
#                   script-message-to local_tools sort-playlist asc #menu: 播放 > 播放列表整理 > 按文件名升序
#                   script-message-to local_tools sort-playlist desc #menu: 播放 > 播放列表整理 > 按文件名降序
#                   playlist-shuffle                              #menu: 播放 > 播放列表整理 > 打乱播放列表
#                   script-message-to local_tools save-playlist    #menu: 播放 > 播放列表整理 > 保存 M3U8
<                   playlist-prev; show-text "播放列表：${playlist-pos-1}/${playlist-count}" #menu: 播放 > 上一项
>                   playlist-next; show-text "播放列表：${playlist-pos-1}/${playlist-count}" #menu: 播放 > 下一项
MBTN_BACK           playlist-prev
MBTN_FORWARD        playlist-next
F7                  script-binding uosc/chapters                  #menu: 播放 > 章节…
#                   script-message-to local_tools chapter-edit add #menu: 播放 > 章节编辑 > 在当前位置添加…
#                   script-message-to local_tools chapter-edit title #menu: 播放 > 章节编辑 > 修改当前标题…
#                   script-message-to local_tools chapter-edit time #menu: 播放 > 章节编辑 > 修改当前时间…
#                   script-message-to local_tools chapter-edit remove #menu: 播放 > 章节编辑 > 删除当前章节
#                   script-message-to local_tools chapter-save chp #menu: 播放 > 章节编辑 > 保存章节修改
#                   script-message-to local_tools chapter-save ogm #menu: 播放 > 章节编辑 > 导出 OGM
#                   script-message-to local_tools skip-segment     #menu: 播放 > 片头片尾 > 跳过当前段
#                   script-message-to local_tools skip-mark opening start #menu: 播放 > 片头片尾 > 标记片头 > 起点
#                   script-message-to local_tools skip-mark opening end #menu: 播放 > 片头片尾 > 标记片头 > 终点并保存
#                   script-message-to local_tools skip-mark ending start #menu: 播放 > 片头片尾 > 标记片尾 > 起点
#                   script-message-to local_tools skip-mark ending end #menu: 播放 > 片头片尾 > 标记片尾 > 终点并保存
PGDWN               add chapter -1                                #menu: 播放 > 上一章节
PGUP                add chapter 1                                 #menu: 播放 > 下一章节
RIGHT               seek 5                                        #menu: 播放 > 跳转 > 前进 5 秒
LEFT                seek -5                                       #menu: 播放 > 跳转 > 后退 5 秒
Shift+RIGHT         seek 1 exact                                  #menu: 播放 > 跳转 > 精确前进 1 秒
Shift+LEFT          seek -1 exact                                 #menu: 播放 > 跳转 > 精确后退 1 秒
#                   script-message-to local_tools skip-to-silence  #menu: 播放 > 跳转 > 下一处静音
,                   frame-back-step                               #menu: 播放 > 跳转 > 上一帧
.                   frame-step                                    #menu: 播放 > 跳转 > 下一帧
Ctrl+z              script-binding undoredo/undo                  #menu: 播放 > 跳转 > 撤销
Ctrl+x              script-binding undoredo/redo                  #menu: 播放 > 跳转 > 重做
[                   no-osd add speed -0.1; script-message-to uosc flash-speed #menu: 播放 > 倍速 > 减慢 0.1 倍
]                   no-osd add speed 0.1; script-message-to uosc flash-speed #menu: 播放 > 倍速 > 加快 0.1 倍
{                   no-osd multiply speed 0.5; script-message-to uosc flash-speed #menu: 播放 > 倍速 > 减半
}                   no-osd multiply speed 2; script-message-to uosc flash-speed #menu: 播放 > 倍速 > 加倍
BS                  no-osd set speed 1; script-message-to uosc flash-speed #menu: 播放 > 倍速 > 恢复 1 倍
l                   ab-loop                                       #menu: 播放 > 循环 > 设置／清除 A–B 循环
L                   cycle-values loop-file inf no                 #menu: 播放 > 循环 > 单文件循环
#                   cycle-values loop-playlist inf no             #menu: 播放 > 循环 > 播放列表循环

# 画面
F8                  script-message-to menu_ui tracks              #menu: 画面 > 所有轨道…
F9                  script-binding uosc/video                      #menu: 画面 > 视频轨…
A                   cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no" #menu: 画面 > 宽高比 #@choices=video-aspect-override
#                   cycle-values video-rotate 0 270 180 90       #menu: 画面 > 旋转 > 向左 90°
#                   cycle-values video-rotate 0 90 180 270       #menu: 画面 > 旋转 > 向右 90°
#                   cycle-values panscan 0 1                     #menu: 画面 > 裁切填充 > 切换填充
w                   add panscan -0.1                              #menu: 画面 > 裁切填充 > 减少裁切
W                   add panscan +0.1                              #menu: 画面 > 裁切填充 > 增加裁切
Alt+-               add video-zoom -0.1                            #menu: 画面 > 缩放与移动 > 缩小
Alt+=               add video-zoom 0.1                             #menu: 画面 > 缩放与移动 > 放大
Alt+LEFT            add video-pan-x -0.1                          #menu: 画面 > 缩放与移动 > 左移
Alt+RIGHT           add video-pan-x 0.1                           #menu: 画面 > 缩放与移动 > 右移
Alt+UP              add video-pan-y -0.1                          #menu: 画面 > 缩放与移动 > 上移
Alt+DOWN            add video-pan-y 0.1                           #menu: 画面 > 缩放与移动 > 下移
Alt+BS              set video-zoom 0; set panscan 0; set video-rotate 0; set video-pan-x 0; set video-pan-y 0; set video-aspect-override no #menu: 画面 > 重置画面调整
1                   add contrast -1                               #menu: 画面 > 调色 > 降低对比度
2                   add contrast 1                                #menu: 画面 > 调色 > 提高对比度
3                   add brightness -1                             #menu: 画面 > 调色 > 降低亮度
4                   add brightness 1                              #menu: 画面 > 调色 > 提高亮度
5                   add gamma -1                                  #menu: 画面 > 调色 > 降低伽马
6                   add gamma 1                                   #menu: 画面 > 调色 > 提高伽马
7                   add saturation -1                             #menu: 画面 > 调色 > 降低饱和度
8                   add saturation 1                              #menu: 画面 > 调色 > 提高饱和度
#                   add hue -1                                    #menu: 画面 > 调色 > 色相 -1
#                   add hue 1                                     #menu: 画面 > 调色 > 色相 +1
#                   set contrast 0; set brightness 0; set gamma 0; set saturation 0; set hue 0 #menu: 画面 > 调色 > 恢复默认

