Ctrl+8              script-message-to quality select shader ravu-zoom-ar #menu: 画质增强 > 单项 Shader > RAVU Zoom
Ctrl+9              script-message-to quality select shader Anime4K-AA #menu: 画质增强 > 单项 Shader > Anime4K 抗锯齿
Ctrl+Alt+1          script-message-to quality select shader ArtCNN-C4F16 #menu: 画质增强 > 单项 Shader > ArtCNN C4F16
Ctrl+Alt+2          script-message-to quality select shader ArtCNN-C4F32 #menu: 画质增强 > 单项 Shader > ArtCNN C4F32
Ctrl+0              script-message-to quality restore shader        #menu: 画质增强 > 关闭所选 Shader

# 音频
F6                  script-binding uosc/audio-device               #menu: 音频 > 输出设备…
F10                 script-binding uosc/audio                      #menu: 音频 > 音轨…
y                   cycle audio                                    #menu: 音频 > 循环切换音轨
m                   cycle mute                                     #menu: 音频 > 静音
Ctrl+,              add audio-delay -0.1; show-text "音频延迟：${audio-delay}" #menu: 音频 > 同步 > 延迟 -0.1 秒
Ctrl+.              add audio-delay 0.1; show-text "音频延迟：${audio-delay}" #menu: 音频 > 同步 > 延迟 +0.1 秒
;                   set audio-delay 0                              #menu: 音频 > 同步 > 重置延迟
#                   script-binding uosc/load-audio                 #menu: 音频 > 加载外挂音轨…
#                   af add "@audio-normalization:lavfi=[dynaudnorm=f=500:g=31:p=0.5:m=5:r=0.9]" #menu: 音频 > 音量均衡 > 动态均衡
#                   af add "@audio-normalization:lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]" #menu: 音频 > 音量均衡 > 响度标准化
#                   af remove @audio-normalization               #menu: 音频 > 音量均衡 > 关闭
#                   cycle-values audio-channels "7.1,5.1,stereo" "7.1" "5.1" "stereo" "auto-safe" "auto" #menu: 音频 > 声道输出 #@choices=audio-channels
WHEEL_UP            no-osd add volume 2; script-message-to uosc flash-volume
WHEEL_DOWN          no-osd add volume -2; script-message-to uosc flash-volume
9                   no-osd add volume -1; script-message-to uosc flash-volume
0                   no-osd add volume 1; script-message-to uosc flash-volume

# 字幕
F11                 script-binding uosc/subtitles                  #menu: 字幕 > 主字幕…
Alt+F11             script-message-to menu_ui secondary           #menu: 字幕 > 次字幕… #@choices=secondary-sid
j                   cycle sub                                      #menu: 字幕 > 循环切换主字幕
k                   cycle secondary-sid                            #menu: 字幕 > 循环切换次字幕
v                   cycle sub-visibility                           #menu: 字幕 > 显示／隐藏主字幕
Alt+v               cycle secondary-sub-visibility                #menu: 字幕 > 显示／隐藏次字幕
#                   script-binding uosc/load-subtitles             #menu: 字幕 > 加载外挂字幕…
r                   add sub-pos -1                                 #menu: 字幕 > 位置和字号 > 上移
t                   add sub-pos 1                                  #menu: 字幕 > 位置和字号 > 下移
Alt+j               add sub-scale -0.1                             #menu: 字幕 > 位置和字号 > 缩小
Alt+k               add sub-scale 0.1                              #menu: 字幕 > 位置和字号 > 放大
#                   add secondary-sub-pos -1                      #menu: 字幕 > 次字幕调整 > 上移
#                   add secondary-sub-pos 1                       #menu: 字幕 > 次字幕调整 > 下移
#                   add secondary-sub-scale -0.1                  #menu: 字幕 > 次字幕调整 > 缩小
#                   add secondary-sub-scale 0.1                   #menu: 字幕 > 次字幕调整 > 放大
#                   add secondary-sub-delay -0.1                  #menu: 字幕 > 次字幕调整 > 延迟 -0.1 秒
#                   add secondary-sub-delay 0.1                   #menu: 字幕 > 次字幕调整 > 延迟 +0.1 秒
z                   add sub-delay -0.1; show-text "字幕延迟：${sub-delay}" #menu: 字幕 > 同步 > 延迟 -0.1 秒
x                   add sub-delay 0.1; show-text "字幕延迟：${sub-delay}" #menu: 字幕 > 同步 > 延迟 +0.1 秒
#                   script-message-to local_tools subtitle-align   #menu: 字幕 > 同步 > 按当前音轨自动对轴
#                   script-message-to local_tools subtitle-export  #menu: 字幕 > 导出当前内封字幕
Ctrl+LEFT           no-osd sub-seek -1                             #menu: 字幕 > 同步 > 上一条字幕
Ctrl+RIGHT          no-osd sub-seek 1                              #menu: 字幕 > 同步 > 下一条字幕
Ctrl+j              sub-seek -1
Ctrl+k              sub-seek 1
g-l                 script-binding select/select-subtitle-line    #menu: 字幕 > 按台词跳转 > 主字幕列表…
g-L                 script-binding select/select-secondary-subtitle-line #menu: 字幕 > 按台词跳转 > 次字幕列表…
u                   cycle-values sub-ass-override "force" "scale" #menu: 字幕 > 样式与兼容 > 主字幕样式覆盖 #@choices=sub-ass-override
#                   cycle secondary-sub-ass-override              #menu: 字幕 > 样式与兼容 > 切换次字幕样式覆盖
#                   cycle sub-fix-timing                          #menu: 字幕 > 样式与兼容 > 修复字幕时序
#                   cycle stretch-image-subs-to-screen            #menu: 字幕 > 样式与兼容 > 修正图像字幕比例
#                   cycle sub-gray                                #menu: 字幕 > 样式与兼容 > 图像字幕灰度
#                   set sub-font "Noto Sans CJK SC"                #menu: 字幕 > 字体 > 简体中文黑体
#                   set sub-font "Noto Serif CJK SC"               #menu: 字幕 > 字体 > 简体中文宋体
#                   set sub-font "Noto Sans CJK KR"                #menu: 字幕 > 字体 > 韩文黑体
#                   set sub-font "Noto Serif CJK KR"               #menu: 字幕 > 字体 > 韩文明朝体
Ctrl+r              sub-reload                                     #menu: 字幕 > 重新加载字幕
Shift+BS            set sub-pos 100; set sub-scale 1; set sub-delay 0; set secondary-sub-pos 0; set secondary-sub-scale 1; set secondary-sub-delay 0 #menu: 字幕 > 重置位置、字号和延迟

# 截图与窗口
s                   screenshot subtitles                           #menu: 截图与导出 > 截图 > 含字幕
S                   screenshot video                               #menu: 截图与导出 > 截图 > 无字幕
Ctrl+s              screenshot window                              #menu: 截图与导出 > 截图 > 窗口
Enter               cycle fullscreen                               #menu: 窗口 > 全屏
Esc                 set fullscreen no; set window-maximized no     #menu: 窗口 > 退出全屏或最大化
Alt+t               cycle ontop                                    #menu: 窗口 > 置顶
Alt+b               cycle window-maximized                         #menu: 窗口 > 最大化
i                   script-binding stats/display-stats            #menu: 工具与高级 > 播放统计
I                   script-binding stats/display-stats-toggle     #menu: 工具与高级 > 常驻播放统计
O                   no-osd cycle-values osd-level 3 1             #menu: 工具与高级 > 常显时间与帧数
P                   show-progress                                 #menu: 工具与高级 > 查看播放进度
#                   script-binding uosc/keybinds                   #menu: 工具与高级 > 所有快捷键…
q                   quit                                           #menu: 退出程序
