# 快捷键与菜单共用入口；本地 menu-ui.lua 复用 uosc 显示状态、直接选择与连续调整。
## #menu: 定义菜单路径；#@choices=属性 定义直接选择；原 #@state 注释保留供原生菜单使用。
# F4–F11 的键位保留，常用列表统一为 uosc；原界面位于“工具与高级 > 备用选择界面”。
# 备用绑定见 archive/input-backup.conf；个人路径与 token 放 local.conf。

## 打开与文件
o                script-message-to uosc open-file                                                                        #menu: 打开与文件 > 浏览文件
CTRL+o           script-message-to open_dialog import_files                                                              #menu: 打开与文件 > 打开文件…
CTRL+SHIFT+v     loadfile ${clipboard/text}                                                                              #menu: 打开与文件 > 打开剪贴板链接
TAB              script-message-to file_browser browse-files;script-message-to file_browser dynamic/reload;show-text ''  #menu: 打开与文件 > 更多打开方式 > OSD 文件浏览器
`                script-message-to simplehistory open-list;show-text ''                                                  #menu: 打开与文件 > 历史 > 历史记录…
ALT+l            script-message-to simplehistory history-incognito-mode                                                  #menu: 打开与文件 > 历史 > 不记录播放历史
CTRL+L           script-message-to simplehistory history-load-last                                                       #menu: 打开与文件 > 历史 > 加载最后播放文件
CTRL+l           script-message-to simplehistory history-resume                                                          #menu: 打开与文件 > 历史 > 加载最后播放文件及进度
N                script-message-to simplebookmark open-list;show-text ''                                                 #menu: 打开与文件 > 书签 > 书签列表…
CTRL+n           script-message-to simplebookmark bookmark-save                                                          #menu: 打开与文件 > 书签 > 添加进度书签
CTRL+N           script-message-to simplebookmark bookmark-fileonly                                                      #menu: 打开与文件 > 书签 > 添加文件书签
CTRL+F           script-message-to quality_menu video_formats_toggle                                                     #menu: 打开与文件 > 网络媒体 > 视频格式…
ALT+F            script-message-to quality_menu audio_formats_toggle                                                     #menu: 打开与文件 > 网络媒体 > 音频格式…
ALT+o            script-message-to uosc show-in-directory                                                                #menu: 打开与文件 > 定位当前文件
DEL              script-message-to delete_current_file delete-file 1  "请按 1 确认删除"                                        #menu: 打开与文件 > 删除当前文件…

## 播放
#                cycle pause;script-message-to uosc flash-pause-indicator                                                #menu: 播放 > 播放／暂停  #@value=pause
SHIFT+F11        stop                                                                                                    #menu: 播放 > 停止
[                no-osd add      speed -0.1; script-message-to uosc flash-speed                                          #menu: 播放 > 速度 > 减慢 0.1 倍
]                no-osd add      speed  0.1; script-message-to uosc flash-speed                                          #menu: 播放 > 速度 > 加快 0.1 倍
{                no-osd multiply speed  0.5; script-message-to uosc flash-speed                                          #menu: 播放 > 速度 > 减半
}                no-osd multiply speed  2.0; script-message-to uosc flash-speed                                          #menu: 播放 > 速度 > 加倍
BS               no-osd set      speed  1.0; script-message-to uosc flash-speed                                          #menu: 播放 > 速度 > 恢复 1 倍
l                ab-loop                                                                                                 #menu: 播放 > 循环与随机 > 设置／清除 A-B 循环
L                cycle-values loop-file inf no;show-text "循环播放:${loop-file}"                                             #menu: 播放 > 循环与随机 > 单文件循环      #@state=(loop_file and 'checked')
n                script-message playlistmanager shuffle                                                                  #menu: 播放 > 循环与随机 > 打乱播放列表并从首项播放
#                script-message-to menu_ui shuffle                                                                       #menu: 播放 > 循环与随机 > 随机播放  #@value=user-data/menu-ui/shuffle
#                cycle-values loop-playlist no inf                                                                       #menu: 播放 > 循环与随机 > 播放列表循环  #@state=(loop_playlist and 'checked')
F5               script-binding uosc/playlist                                                                            #menu: 播放 > 播放列表…
<                playlist-prev;show-text "播放列表:${playlist-pos-1}/${playlist-count}"                                      #menu: 播放 > 上个文件
>                playlist-next;show-text "播放列表:${playlist-pos-1}/${playlist-count}"                                      #menu: 播放 > 下个文件
F7               script-binding uosc/chapters                                                                            #menu: 播放 > 章节…
PGDWN            add chapter -1                                                                                          #menu: 播放 > 上一章节
PGUP             add chapter  1                                                                                          #menu: 播放 > 下一章节
ALT+q            script-message-to chapterskip chapter-skip                                                              #menu: 播放 > 章节 > 自动跳过章节
ALT+n            script-message-to chapterskip toggle-markskip                                                           #menu: 播放 > 章节 > 标记片头片尾
#                script-binding uosc/editions                                                                            #menu: 播放 > 版本…
F8               script-message-to menu_ui tracks                                                                        #menu: 播放 > 所有轨道…
F3               script-message-to chapterskip skip-to-silence;show-text "跳到下一个静音位置"                                     #menu: 播放 > 跳转 > 下一个静音位置
CTRL+z           script-message-to undoredo undo                                                                         #menu: 播放 > 跳转 > 撤消跳转
CTRL+x           script-message-to undoredo redo                                                                         #menu: 播放 > 跳转 > 重做跳转
CTRL+ALT+z       script-message-to undoredo undoLoop                                                                     #menu: 播放 > 跳转 > 循环跳转
,                frame-back-step;show-text "当前帧：${estimated-frame-number}"                                               #menu: 播放 > 逐帧与快进 > 上一帧
.                frame-step     ;show-text "当前帧：${estimated-frame-number}"                                               #menu: 播放 > 逐帧与快进 > 下一帧
RIGHT            seek  5                                                                                                 #menu: 播放 > 逐帧与快进 > 前进 5 秒
LEFT             seek -5                                                                                                 #menu: 播放 > 逐帧与快进 > 后退 5 秒
SHIFT+RIGHT      seek  1 exact                                                                                           #menu: 播放 > 逐帧与快进 > 精准前进 1 秒
SHIFT+LEFT       seek -1 exact                                                                                           #menu: 播放 > 逐帧与快进 > 精准后退 1 秒

## 画面
F9               script-binding uosc/video                                                                               #menu: 画面 > 视频轨…
A                cycle-values video-aspect-override 16:9 4:3 2.35:1 no ;show-text "宽高比:${video-aspect-override}"         #menu: 画面 > 宽高比  #@choices=video-aspect-override
CTRL+LEFT        cycle-values video-rotate 0 270 180 90;show-text "视频旋转:${video-rotate}"                                 #menu: 画面 > 旋转 > 向左旋转 90°
CTRL+RIGHT       cycle-values video-rotate 0 90 180 270;show-text "视频旋转:${video-rotate}"                                 #menu: 画面 > 旋转 > 向右旋转 90°
ALT+-            add video-zoom   -0.1;show-text "画面缩小:${video-zoom}"                                                    #menu: 画面 > 缩放与移动 > 画面缩小
ALT+=            add video-zoom    0.1;show-text "画面放大:${video-zoom}"                                                    #menu: 画面 > 缩放与移动 > 画面放大
ALT+LEFT         add video-pan-x  -0.1;show-text "画面左移动:${video-pan-x}"                                                  #menu: 画面 > 缩放与移动 > 画面左移动
ALT+RIGHT        add video-pan-x   0.1;show-text "画面右移动:${video-pan-x}"                                                  #menu: 画面 > 缩放与移动 > 画面右移动
ALT+UP           add video-pan-y  -0.1;show-text "画面上移动:${video-pan-y}"                                                  #menu: 画面 > 缩放与移动 > 画面上移动
ALT+DOWN         add video-pan-y   0.1;show-text "画面下移动:${video-pan-y}"                                                  #menu: 画面 > 缩放与移动 > 画面下移动
ALT+p            cycle-values panscan 0.0 1.0;show-text "视频画面缩放:${panscan}"                                              #menu: 画面 > 裁切填充        #@state=(panscan ~= 0 and 'checked')
ALT+BS           set video-zoom 0;set panscan 0;set video-rotate 0;set video-pan-x 0;set video-pan-y 0;set video-aspect-override no;show-text "重置画面操作" #menu: 画面 > 重置画面调整
1                add contrast -1;show-text "对比度:${contrast}"                                                             #menu: 画面 > 调色 > 对比度 -1
2                add contrast  1;show-text "对比度:${contrast}"                                                             #menu: 画面 > 调色 > 对比度 +1
3                add brightness -1;show-text "明度:${brightness}"                                                          #menu: 画面 > 调色 > 明度 -1
4                add brightness  1;show-text "明度:${brightness}"                                                          #menu: 画面 > 调色 > 明度 +1
5                add gamma -1;show-text "伽马:${gamma}"                                                                    #menu: 画面 > 调色 > 伽马 -1
6                add gamma  1;show-text "伽马:${gamma}"                                                                    #menu: 画面 > 调色 > 伽马 +1
7                add saturation -1;show-text "饱和度:${saturation}"                                                         #menu: 画面 > 调色 > 饱和度 -1
8                add saturation  1;show-text "饱和度:${saturation}"                                                         #menu: 画面 > 调色 > 饱和度 +1
-                add hue -1;show-text "色相:${hue}"                                                                        #menu: 画面 > 调色 > 色相 -1
=                add hue  1;show-text "色相:${hue}"                                                                        #menu: 画面 > 调色 > 色相 +1
CTRL+BS          set contrast 0;set brightness 0;set gamma 0;set saturation 0;set hue 0;show-text "重置调色"                 #menu: 画面 > 调色 > 重置
C                script-message-to dynamic_crop toggle_crop                                                              #menu: 画面 > 自动去黑边（循环模式）

## 画质增强
#                script-message-to gpu_effects menu                                                                      #menu: 画质增强 > 画面增强…
ALT+1            apply-profile FSRCNNX;show-text "配置组：FSRCNNX"                                                           #menu: 画质增强 > shader 组合预设 > FSRCNNX
ALT+2            apply-profile FSRCNNX+;show-text "配置组：FSRCNNX+"                                                         #menu: 画质增强 > shader 组合预设 > FSRCNNX+
ALT+3            apply-profile ravu-zoom;show-text "配置组：ravu-zoom"                                                       #menu: 画质增强 > shader 组合预设 > ravu-zoom
ALT+4            apply-profile AnimeJaNai;show-text "配置组：AnimeJaNai"                                                     #menu: 画质增强 > shader 组合预设 > AnimeJaNai
ALT+5            apply-profile Ani4K;show-text "配置组：Ani4K"                                                               #menu: 画质增强 > shader 组合预设 > Ani4K
ALT+6            apply-profile Anime4K;show-text "配置组：Anime4K"                                                           #menu: 画质增强 > shader 组合预设 > Anime4K
ALT+7            apply-profile NNEDI3;show-text "配置组：NNEDI3"                                                             #menu: 画质增强 > shader 组合预设 > NNEDI3
ALT+8            apply-profile NNEDI3+;show-text "配置组：NNEDI3+"                                                           #menu: 画质增强 > shader 组合预设 > NNEDI3+
CTRL+1           change-list glsl-shaders toggle "~~/shaders/igv/KrigBilateral.glsl"  ;show-text "KrigBilateral 已切换"     #menu: 画质增强 > 单项 shader > KrigBilateral
CTRL+2           change-list glsl-shaders toggle "~~/shaders/igv/SSimSuperRes.glsl"  ;show-text "SSimSuperRes 已切换"       #menu: 画质增强 > 单项 shader > SSimSuperRes
CTRL+3           change-list glsl-shaders toggle "~~/shaders/igv/SSimDownscaler.glsl"  ;show-text "SSimDownscaler 已切换"   #menu: 画质增强 > 单项 shader > SSimDownscaler
CTRL+4           change-list glsl-shaders toggle "~~/shaders/igv/adaptive-sharpen.glsl"  ;show-text "自适应锐化 已切换"          #menu: 画质增强 > 单项 shader > 自适应锐化
CTRL+5           change-list glsl-shaders toggle "~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl"  ;show-text "FSRCNNX 已切换"      #menu: 画质增强 > 单项 shader > FSRCNNX
CTRL+6           change-list glsl-shaders toggle "~~/shaders/igv/FSRCNNX_x1_16-0-4-1_distort.glsl"  ;show-text "FSRCNNX-distort 已切换" #menu: 画质增强 > 单项 shader > FSRCNNX-distort
CTRL+7           change-list glsl-shaders toggle "~~/shaders/nnedi3/nnedi3-nns32-win8x4.glsl"  ;show-text "nns32-4 已切换"  #menu: 画质增强 > 单项 shader > nns32-4
CTRL+8           change-list glsl-shaders toggle "~~/shaders/ravu/ravu-zoom-ar-r3.glsl"  ;show-text "ravu-zoom-ar 已切换"   #menu: 画质增强 > 单项 shader > ravu-zoom-ar
CTRL+9           change-list glsl-shaders toggle "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl"  ;show-text "Anime4K 抗锯齿 已切换" #menu: 画质增强 > 单项 shader > Anime4K 抗锯齿
D                cycle deband;show-text "去色带:${deband}"                                                                  #menu: 画质增强 > 去色带 > 启用去色带	  #@state=(deband and 'checked')
ALT+z            add   deband-iterations +1;show-text "增加去色带强度:${deband-iterations}"                                     #menu: 画质增强 > 去色带 > 增加强度
ALT+x            add   deband-iterations -1;show-text "降低去色带强度:${deband-iterations}"                                     #menu: 画质增强 > 去色带 > 降低强度
CTRL+I           cycle icc-profile-auto   ;show-text "ICC 自动校色:${icc-profile-auto}"                                      #menu: 画质增强 > 高级渲染 > 自动 ICC 校色   #@state=(icc_profile_auto and 'checked')
h                cycle-values tone-mapping auto spline bt.2390 hable bt.2446a st2094-40 st2094-10;show-text "HDR 映射曲线:${tone-mapping}" #menu: 画质增强 > 高级渲染 > HDR > 映射曲线  #@choices=tone-mapping
ALT+h            cycle-values hdr-compute-peak yes no;show-text "HDR 动态映射:${hdr-compute-peak}"                           #menu: 画质增强 > 高级渲染 > HDR > 动态峰值检测  #@state=(hdr_compute_peak and 'checked')
CTRL+P           script-message cycle-commands "apply-profile FSRCNNX;show-text 配置组：FSRCNNX" "apply-profile FSRCNNX+;show-text 配置组：FSRCNNX+" "apply-profile NNEDI3;show-text 配置组：NNEDI3" "apply-profile ravu-zoom;show-text 配置组：ravu-zoom" "apply-profile Anime4K;show-text 配置组：Anime4K" # 循环切换 shader 组合预设
CTRL+h           cycle target-colorspace-hint;show-text "HDR 直通模式:${target-colorspace-hint}"                             #menu: 画质增强 > 高级渲染 > HDR > 输出色彩空间提示  #@state=(target_colorspace_hint and 'checked')
CTRL+t           cycle-values target-trc auto pq gamma2.2;show-text "显示器传输特性:${target-trc}"                              #menu: 画质增强 > 高级渲染 > HDR > 显示器传输特性  #@choices=target-trc
CTRL+T           cycle-values hdr-reference-white 100 203;show-text "HDR 参考白亮度:${hdr-reference-white}"                   #menu: 画质增强 > 高级渲染 > HDR > 参考白亮度  #@choices=hdr-reference-white
CTRL+g           cycle gamut-mapping-mode ;show-text "色域映射模式:${gamut-mapping-mode}"                                      #menu: 画质增强 > 高级渲染 > HDR > 色域映射模式
ALT+i            cycle interpolation    ;show-text "抖动补偿:${interpolation}"                                               #menu: 画质增强 > 高级渲染 > 显示同步插帧              #@state=(interpolation and 'checked')
d                cycle deinterlace;show-text "去交错:${deinterlace}"                                                        #menu: 画质增强 > 高级渲染 > 反交错                #@state=(deinterlace and 'checked')
ALT+~            script-message-to gpu_effects clear-vf                                                                  #menu: 画质增强 > 清空滤镜与着色器 > 清空视频滤镜
CTRL+0           script-message-to gpu_effects clear-shaders                                                             #menu: 画质增强 > 清空滤镜与着色器 > 清空着色器
#                script-message-to gpu_effects restore-defaults                                                          #menu: 画质增强 > 清空滤镜与着色器 > 同时清空滤镜与着色器

## 音频
F10              script-binding uosc/audio                                                                               #menu: 音频 > 音轨…
F6               script-binding uosc/audio-device                                                                        #menu: 音频 > 输出设备…
y                cycle audio;show-text "音轨切换为:${audio}" # 循环切换音轨
m                cycle mute;show-text "静音:${mute}"                                                                       #menu: 音频 > 静音          #@state=(mute and 'checked')
CTRL+,           add audio-delay -0.1;show-text "音频延迟:${audio-delay}"                                                    #menu: 音频 > 时间同步 > 延迟 -0.1 秒
CTRL+.           add audio-delay  0.1;show-text "音频延迟:${audio-delay}"                                                    #menu: 音频 > 时间同步 > 延迟 +0.1 秒
;                set audio-delay  0  ;show-text "重置音频延迟:${audio-delay}"                                                  #menu: 音频 > 时间同步 > 重置延迟
F2               cycle-values  af "@dynaudnorm:lavfi=[dynaudnorm=f=500:g=31:p=0.5:m=5:r=0.9]" "@loudnorm:lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]" "" #menu: 音频 > 音量均衡模式  #@choices=af
ALT+y            cycle-values audio-channels "7.1,5.1,stereo" "7.1" "5.1" "stereo" "auto-safe" "auto";show-text "音频通道输出方式:${audio-channels}" #menu: 音频 > 声道输出  #@choices=audio-channels
#                script-binding uosc/load-audio                                                                          #menu: 音频 > 加载外部音轨…
CTRL+y           cycle audio-exclusive  ;show-text "音频独占模式:${audio-exclusive}"                                           #menu: 音频 > 高级 > 独占输出  #@state=(audio_exclusive and 'checked')
ALT+`            af clr ""                                                                                               #menu: 音频 > 清空所有音频滤镜

## 字幕
F11              script-binding uosc/subtitles                                                                           #menu: 字幕 > 选择主字幕…
ALT+F11          script-message-to menu_ui secondary                                                                     #menu: 字幕 > 选择次字幕  #@choices=secondary-sid
j                cycle sub;show-text "字幕切换为:${sub}" # 循环切换主字幕
k                cycle secondary-sid;show-text "切换次字幕:${secondary-sid}" # 循环切换次字幕
v                cycle sub-visibility;show-text "字幕可见性:${sub-visibility}"                                                #menu: 字幕 > 显示主字幕   #@state=(sub_visibility and 'checked')
ALT+V            cycle secondary-sub-visibility;show-text "次字幕可见性:${secondary-sub-visibility}"                           #menu: 字幕 > 显示次字幕 #@state=(secondary_sub_visibility and 'checked')
#                script-binding uosc/load-subtitles                                                                      #menu: 字幕 > 加载外部字幕…
r                add sub-pos -1;show-text "字幕上移:${sub-pos}"                                                              #menu: 字幕 > 主字幕调整 > 字幕上移
t                add sub-pos +1;show-text "字幕下移:${sub-pos}"                                                              #menu: 字幕 > 主字幕调整 > 字幕下移
ALT+j            add sub-scale -0.1;show-text "字幕缩小:${sub-scale}"                                                        #menu: 字幕 > 主字幕调整 > 字号 -0.1
ALT+k            add sub-scale  0.1;show-text "字幕放大:${sub-scale}"                                                        #menu: 字幕 > 主字幕调整 > 字号 +0.1
R                add secondary-sub-pos -1;show-text "次字幕上移:${secondary-sub-pos}"                                         #menu: 字幕 > 次字幕调整 > 次字幕上移
T                add secondary-sub-pos +1;show-text "次字幕下移:${secondary-sub-pos}"                                         #menu: 字幕 > 次字幕调整 > 次字幕下移
ALT+J            add secondary-sub-scale -0.1;show-text "次字幕缩小:${secondary-sub-scale}"                                   #menu: 字幕 > 次字幕调整 > 次字幕字号 -0.1
ALT+K            add secondary-sub-scale  0.1;show-text "次字幕放大:${secondary-sub-scale}"                                   #menu: 字幕 > 次字幕调整 > 次字幕字号 +0.1
CTRL+m           script-message-to autosubsync autosubsync-menu                                                          #menu: 字幕 > 时间同步 > 自动同步…
z                add sub-delay -0.1;show-text "字幕延迟:${sub-delay}"                                                        #menu: 字幕 > 时间同步 > 主字幕延迟 -0.1 秒
x                add sub-delay  0.1;show-text "字幕延迟:${sub-delay}"                                                        #menu: 字幕 > 时间同步 > 主字幕延迟 +0.1 秒
Z                add secondary-sub-delay -0.1;show-text "次字幕延迟:${secondary-sub-delay}"                                   #menu: 字幕 > 时间同步 > 次字幕延迟 -0.1 秒
X                add secondary-sub-delay  0.1;show-text "次字幕延迟:${secondary-sub-delay}"                                   #menu: 字幕 > 时间同步 > 次字幕延迟 +0.1 秒
CTRL+j           sub-seek -1                                                                                             #menu: 字幕 > 时间同步 > 跳转上一条字幕
CTRL+k           sub-seek  1                                                                                             #menu: 字幕 > 时间同步 > 跳转下一条字幕
CTRL+f           script-message-to sub_assrt sub-assrt                                                                   #menu: 字幕 > 下载／生成 > 下载字幕…
ALT+f            script-message-to sub_fastwhisper sub-fastwhisper                                                       #menu: 字幕 > 下载／生成 > 生成 AI 字幕
#                script-message-to sub_fastwhisper sub-fastwhisper-manager                                               #menu: 字幕 > 下载／生成 > AI 字幕…
CTRL+M           script-binding select/select-subtitle-line                                                              #menu: 字幕 > 字幕内容 > 主字幕内容…
CTRL+ALT+M       script-binding select/select-secondary-subtitle-line                                                    #menu: 字幕 > 字幕内容 > 次字幕内容…
CTRL+r           sub-reload;show-text "重载当前字幕"                                                                           #menu: 字幕 > 重载／导出 > 重载当前字幕
