Alt+7               script-message-to quality select shader NNEDI3   #menu: 画质增强 > Shader 组合 > NNEDI3
Alt+8               script-message-to quality select shader NNEDI3+  #menu: 画质增强 > Shader 组合 > NNEDI3+
