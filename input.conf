SHARP            script-message-to gpu_effects toggle MEMC_DRBA_DML  # GPU 增强：MEMC_DRBA_DML
$                script-message-to gpu_effects toggle MEMC_RIFE_TRT  # GPU 增强：MEMC_RIFE_TRT
%                script-message-to gpu_effects toggle MEMC_DRBA_TRT  # GPU 增强：MEMC_DRBA_TRT
^                script-message-to gpu_effects toggle SR_AnimeJaNaiV2_DML  # GPU 增强：SR_AnimeJaNaiV2_DML
ALT+^            script-message-to gpu_effects toggle SR_AnimeJaNaiV2_TRT  # GPU 增强：SR_AnimeJaNaiV2_TRT
&                script-message-to gpu_effects toggle SR_ARTCNN_TRT  # GPU 增强：SR_ARTCNN_TRT
ALT+&            script-message-to gpu_effects toggle SR_ARTCNN_CHROMA_TRT  # GPU 增强：SR_ARTCNN_CHROMA_TRT
*                script-message-to gpu_effects toggle SR_AnimeJaNaiV3_TRT  # GPU 增强：SR_AnimeJaNaiV3_TRT
