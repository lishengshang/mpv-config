# 默认识别方案：whisper 或 qwen；菜单切换在当前播放器内有效
backend=whisper
# Qwen 的 Python / 模型路径放在 local.conf；安装方法见 docs/ai-subtitles.md
# Qwen 独立按静音优先切片，识别与对齐串行运行，不使用下方 Whisper 分段选项
qwen_chunk_seconds=20
# faster-whisper 可执行文件的路径，支持绝对路径和相对路径。下载：https://github.com/Purfview/whisper-standalone-win
# 本机路径写在 ~~/local.conf（已 gitignore），script-opts 优先级高于本文件，故此处保持缺省
# 指定要使用的模型，可用模型有：base, small, medium, large, large-v2, large-v3, large-v3-turbo
# 模型需另外部署；速度取决于片源、模型加载与识别模式，实测边界见 docs/ai-subtitles.md
model=large-v3-turbo
# 指定要使用的设备，可用设备有：cpu、cuda。脚本默认是 cpu，不改则完全用不上显卡
device=cuda
# 指定要使用的计算类型，可用类型有：default,auto,int8,int8_float16,int8_float32,int8_bfloat16,int16,float16,float32,bfloat16
compute_type=float16
# 指定转录语音的语言，留空将自动检测
#language=ja
# 指定使用的 CPU 线程数
# 默认值为 0，将自动检测，但最多 4 个线程
#threads=8
# 换行前一行的最大字符数
max_line_width=100
# AI 字幕集中缓存根目录；脚本在其下按媒体和模型创建独立目录并复用完成结果
# 不在视频同级写入字幕；旧值 source 也会回退到此缓存目录
output_path=~~/cache/ai-subtitles
# 保留上游兼容选项；当前整片模式在完成后加载后端输出，不从日志拼接字幕
update_interval=20
# 分段转录可在整片完成前显示首批原文字幕
# 每段重新启动后端，可能增加总耗时；固定边界也可能影响识别完整性
# 固定切片目标：首段 min(本值, 15) 秒，之后 max(本值, 40) 秒；静音切片可在目标附近调整
#! Depends on FFmpeg
use_segment=no
# 分段时在目标边界前后 3 秒内找静音（-35dB、至少 0.25 秒），没有则按固定时长切片
# 首段仍不超过 15 秒；设 no 可对照旧固定切片，完成缓存与静音切片分开
segment_silence=yes
# 以秒为单位的分段持续时间；调大可缩短整片总耗时，但会为该设置重新生成一次字幕缓存
segment_duration=10
## GPT API 选项 ###
# 与其他结构与 GPT API 相同的 AI API 兼容
# 推荐使用智谱 GLM 的免费 AI 模型：glm-4-flash
api_url=https://open.bigmodel.cn/api/paas/v4/chat/completions
# api key 需自行在对应 AI 平台的个人账号下申请
api_key=
# 指定要使用的 AI 模型
api_mode=glm-4-flash
api_temperature=0.95
# API 使用的每分钟速率。有关说明请参阅相应的 API 文档
api_rate=15
# 自动翻译日语及其他明确语种；中文、英语和未知语种仅生成原文，no 关闭自动翻译
auto_translate=foreign
# 全文校准和翻译共用请求预算；重试计入，到限暂停，可在管理菜单手动追加同档预算
translation_max_requests=20
# 不限制本地累计输入字符数；接口自身的上下文和输出上限仍由服务商决定
translation_max_chars=0
# 每次接口请求的最长等待秒数，含全文校准
api_timeout=180
# 网络失败、HTTP 408/429/5xx 最多重试两次；认证/格式错误需手动处理
translation_retries=2
translation_retry_base=2
# 指定 AI 翻译的目标语言
translate=Chinese
# 指定生成的 ass 字幕所使用的字体
font_name=Noto Sans CJK SC
# 仅 AI 播放用字幕字号相对原来缩为 80%，不修改全局字幕字号或原始 SRT
font_scale=0.8
# 单行宽度按半角字符计，中文约占 2；双语每种语言最多一行
layout_line_width=56
# 播放用 ASS 每屏最多两行，长句分屏显示
layout_max_lines=2
# 长段字幕按字数近似分配时间，不代替逐词强制对齐
layout_max_seconds=6
