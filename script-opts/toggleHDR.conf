# Windows HDR 自动切换，依赖 HDRTray 提供的 HDRCmd.exe
# 下载：https://github.com/res2k/HDRTray/releases
# 本机路径写在 ~~/local.conf（已 gitignore），不要写进本文件：
# script-opts-append=toggleHDR-hdr_cmd_path=D:\path\to\HDRTray\HDRCmd.exe
# 未配置路径时脚本不接管 HDR，也不告警

# 总开关：yes 接管 HDR 切换，no 完全不操作
enabled=yes

# 留空即不接管；实际路径由 ~~/local.conf 提供
hdr_cmd_path=

# 显示器 HDR + 视频 HDR：不动作，仅记日志
hdr_hdr=yes

# 显示器 HDR + 视频 SDR：关闭 HDR，播放结束恢复
# 若要让 SDR 视频映射成 HDR 播放，此项设为 no
hdr_off_open=yes

# 显示器 SDR + 视频 HDR：开启 HDR，播放结束关闭
hdr_open_off=yes

# 显示器 SDR + 视频 SDR：不动作，仅记日志
sdr_sdr=yes
