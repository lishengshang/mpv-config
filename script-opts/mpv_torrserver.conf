##指定 TorrServer HTTP 地址，示例为默认值
server=http://localhost:8090
##指定是否启用 TorrServer 初始化。默认值：no
#! 仅当 TorrServer 位于同一台设备上且未设置自启动时，才需要启用此选项
torrserver_init=yes
##指定 TorrServer 路径，可为相对路径（已设环境变量）或绝对路径。需自行安装：https://github.com/YouROK/TorrServer
#! 仅当 torrserver_init=yes 时才需设置
#! 此处保持缺省:本机绝对路径写在 ~~/local.conf（已 gitignore），script-opts 优先级高于本文件，可正常覆盖
##指定是否查找可能的外部轨道（音轨、字幕）。默认值：yes
search_for_external_tracks=yes